; Token Meter firmware for the Waveshare ESP32-S3-RLCD-4.2
; (ESP32-S3-WROOM-1-N16R8: 16 MB flash, 8 MB octal PSRAM; 400x300 ST7305 RLCD).
; Platform pin matches esp32-clawdmeter (pioarduino, Arduino core 3.x).

[platformio]
default_envs = rlcd42

[env:rlcd42]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.38-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.arduino.memory_type = qio_opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = default_16MB.csv
upload_speed = 921600
monitor_speed = 115200

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    -DCONFIG_BT_NIMBLE_ROLE_BROADCASTER=1
    -DCONFIG_BT_NIMBLE_ROLE_PERIPHERAL=1
    -DCONFIG_BT_NIMBLE_ROLE_CENTRAL=0
    -DCONFIG_BT_NIMBLE_ROLE_OBSERVER=0
    -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=2

lib_deps =
    olikraus/U8g2@^2.36.2
    h2zero/NimBLE-Arduino@^2.1.1
    bblanchon/ArduinoJson@^7.0.0
